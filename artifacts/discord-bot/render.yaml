services:
  - type: worker
    name: tdc-discord-bot
    runtime: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/discord-bot run build
    startCommand: pnpm --filter @workspace/discord-bot run start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: TDC_DATA_DIR
        value: /opt/render/project/src/artifacts/discord-bot/data
      - key: BOT_HTTP_PORT
        value: "10000"
      - key: NODE_ENV
        value: production
    autoDeploy: true
    disk:
      name: tdc-discord-data
      mountPath: /opt/render/project/src/artifacts/discord-bot/data
      sizeGB: 1
